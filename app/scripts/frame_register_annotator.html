<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>完整母版标记工具</title><style>*{box-sizing:border-box}body{background:#19282c;color:#e1e9e3;font:16px system-ui;margin:20px}.controls{display:flex;flex-wrap:wrap;gap:10px}button,select{min-height:44px;font:inherit;padding:8px}canvas{display:block;max-width:100%;max-height:78vh;background:#e8ede7;margin:12px 0;cursor:crosshair}p{max-width:900px;line-height:1.6}#status{white-space:pre-line}</style><h1>完整母版标记工具</h1><p>选择帧和标记名，再点击原图。标记头部基准、身体轴、承重脚底与比例检查点；左右为人物自身左右。只修改坐标，不修改原图。保存后将 JSON 放回原 manifest 位置，再运行 register。源图变化必须重新核对并更新 hash。</p><div class="controls"><select id="frame" aria-label="帧"></select><select id="marker" aria-label="标记"></select><button id="undo">撤销本次点击</button><button id="save">下载标记 JSON</button></div><canvas id="canvas"></canvas><p id="status"></p><script id="data" type="application/json">__PAYLOAD__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),ctx=$('canvas').getContext('2d')
const images=data.images.map(src=>{const im=new Image();im.src=src;return im}),history=[]
data.manifest.frames.forEach((f,i)=>{$('frame').add(new Option(f.id,String(i)))})
function frame(){return data.manifest.frames[Number($('frame').value)]}
function populate(){const old=$('marker').value;$('marker').replaceChildren(...Object.keys(frame().markers).map(k=>new Option(k,k)));if(Object.hasOwn(frame().markers,old))$('marker').value=old;draw()}
function draw(){const im=images[Number($('frame').value)];$('canvas').width=im.naturalWidth;$('canvas').height=im.naturalHeight;ctx.drawImage(im,0,0);ctx.font='24px system-ui';for(const[k,p]of Object.entries(frame().markers)){ctx.fillStyle=k===$('marker').value?'#e36a30':'#247e9a';ctx.beginPath();ctx.arc(p[0],p[1],6,0,Math.PI*2);ctx.fill();ctx.fillText(k,p[0]+8,p[1]-8)}$('status').textContent=JSON.stringify(frame().markers,null,2)}
$('canvas').onclick=e=>{const box=$('canvas').getBoundingClientRect(),f=frame(),k=$('marker').value;history.push({i:Number($('frame').value),k,p:[...f.markers[k]]});f.markers[k]=[Math.round((e.clientX-box.left)*$('canvas').width/box.width),Math.round((e.clientY-box.top)*$('canvas').height/box.height)];draw()}
$('frame').onchange=populate;$('marker').onchange=draw
$('undo').onclick=()=>{const h=history.pop();if(!h)return;data.manifest.frames[h.i].markers[h.k]=h.p;$('frame').value=String(h.i);populate()}
$('save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data.manifest,null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='registration.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
Promise.all(images.map(im=>im.decode())).then(populate).catch(e=>$('status').textContent=e.message)
</script></html>
